<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="cyTitle cyDesc">
  <title id="cyTitle">Courtyard coordinate grid for Question 4833</title>
  <desc id="cyDesc">A 10 by 10 coordinate grid (column 0-10 on the X axis, row 0-10 on the Y axis) with four points marked: A at (3,4), B at (6,7), C at (9,4), and D at (7,2).</desc>
  <!--
    Board Ready generated visual (Batch 15, Task 10, PROPOSED, NOT associated
    with the live question). asset_type (if approved): ai_generated -- a
    clean, native redraw of the ORIGINAL SOURCE figure below, not the source
    figure itself. Colors read from this host page's ink CSS custom property
    via var(), no prefers-color-scheme fallback -- matches every other
    generated visual in this pipeline.

    ============================================================
    IMPORTANT -- READ BEFORE ASSOCIATING OR PROMOTING THIS QUESTION
    ============================================================
    While building this visual (Task 10), a rigorous re-verification of the
    source figure's plotted-point coordinates turned up THREE independent,
    confirmed content defects in question 4833's stored parts_json and in
    the source book's own printed answer key. These are documented in full
    in docs/workstream-4j-4833-answer-key-defects.md (which also amends and
    partially retracts docs/workstream-4f-4833-investigation.md's prior
    conclusion that "the database is correct in full for this question" --
    that conclusion does not survive this session's more rigorous check).
    This SVG faithfully reproduces the DIAGRAM as printed; it does not
    change, and is not a substitute for review of, the question's text,
    options, or stored `correct` values, which remain uncorrected pending
    their own individually-approved review (no live write is proposed here).

    SOURCE OF TRUTH this was redrawn from (never modified):
    source_library/CBSE/Mathematics/ch5-6.pdf, file page index 18 (prints as
    page 6.23), Fig. 6.19, immediately below item (73)'s stem. Source PDF
    sha256: 5227561e11950d5fc53a80babad23967180be0e7638111cceb6567b079ae1220.
    A clean crop of the source figure (including its axis labels and the
    "Fig. 6.19" caption) is saved as the immutable source_cropped reference:
    extracted-diagrams/cbse-mathematics-co-ordinate-geometry-845687ea-item73-courtyardgrid-CANDIDATE.png,
    sha256 ab1af38854f2c37fd7a8205059c65bc425fc60a77018181f21e6614df0d2a160.

    COORDINATE VERIFICATION METHOD (this is how (3,4)/(6,7)/(9,4)/(7,2) were
    established, not assumed from the key or from a rough visual estimate):
    1. The source page was rendered at high zoom and the pixel positions of
       all 11 vertical and 11 horizontal gridlines were detected
       programmatically (numpy column/row dark-pixel-density peak-finding),
       giving an exact pixel position for every integer column 0-10 and row
       0-10.
    2. The four small filled-circle point markers (distinct from the
       decorative face icons and from the thin gridlines themselves) were
       isolated programmatically via morphological erosion (which removes
       thin gridlines but preserves the thicker solid dot markers) and their
       centroids computed.
    3. Each dot centroid was matched against the gridline pixel grid from
       step 1. All four matched a gridline intersection to within 0.5-3
       pixels (out of a ~161px grid spacing) -- i.e. essentially exactly,
       not an approximate or rounded reading:
         A -> column 3, row 4   => (3, 4)
         B -> column 6, row 7   => (6, 7)
         C -> column 9, row 4   => (9, 4)
         D -> column 7, row 2   => (7, 2)
    4. This was independently corroborated (not merely re-observed) by two
       further checks documented in workstream-4j:
         - Part (iv)'s stored answer ("Area of triangle ABC = 9 sq. units")
           is reproduced exactly by these coordinates via the shoelace
           formula.
         - Part (ii)'s stored answer ("the figure ABCD is NOT a
           parallelogram") is ONLY a well-posed, internally consistent
           answer when A=(3,4): that reading makes AB parallel to CD
           (both slope 1) while BC and DA are not parallel to each other,
           i.e. a genuine trapezium with a single well-defined "odd one
           out" among rhombus/square/parallelogram/trapezium. Substituting
           the key's claimed A=(4,3) instead produces a quadrilateral with
           NO pair of parallel sides at all, which cannot yield a uniquely
           correct answer to "which of these four shapes is it NOT" -- every
           option would be a correct "not". This is independent, purely
           mathematical evidence (not a second pixel reading) that (3,4) is
           the figure's true intended point, not (4,3).
       See workstream-4j for the fuller writeup, including that part (iii)'s
       stored/keyed answer ("0") is separately, unconditionally impossible:
       a distance of 0 between the diagonals' midpoints would itself imply
       ABCD IS a parallelogram, directly contradicting part (ii)'s own
       stored answer that it is NOT one -- a defect in the source's key that
       holds regardless of which reading of A is used.

    DESIGN DECISIONS (disclosed departures from the source page, none of
    which change any mathematical content):
      - The source's alternating light/dark checkerboard cell shading and
        the decorative face-icon avatars at each point are page styling,
        not mathematical content (they illustrate "four people sitting" for
        a young-reader case-study framing) -- this redraw omits them and
        keeps a plain white grid with the four points marked as simple
        labeled dots, exactly as every other clean geometric redraw in this
        pipeline (1508, 1231, 1594, 1230) omits source decoration while
        preserving all drawn mathematical elements exactly.
      - The source repeats small tick-mark arrowheads along both axes
        (suggesting the axes continue indefinitely); this redraw keeps that
        same meaning with a single arrowhead terminating each axis, rather
        than reproducing every repeated decorative tick arrow individually.
      - The source draws NO line segments connecting A, B, C, D -- the
        quadrilateral ABCD is only implied by the question text ("by
        joining A to B, B to C, C to D and D to A..."), never drawn in the
        figure itself. This redraw preserves that exactly: no connecting
        lines are drawn. Adding them would be adding information the source
        figure does not contain.
      - Axis labels (X, Y, O, "Column", "Rows") and the integer gridline
        labels 0-10 on both axes are reproduced exactly as printed, in the
        same positions relative to the grid.
  -->
  <style>
    .cy-grid { fill: none; stroke: var(--ink); stroke-width: 1; opacity: 0.35; }
    .cy-axis { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .cy-point { fill: var(--ink); }
    .cy-label { fill: var(--ink); font-family: "Manrope","Segoe UI",system-ui,sans-serif; font-size: 22px; }
    .cy-axislabel { fill: var(--ink); font-family: "Manrope","Segoe UI",system-ui,sans-serif; font-size: 24px; font-weight: 700; }
    .cy-ticklabel { fill: var(--ink); font-family: "Manrope","Segoe UI",system-ui,sans-serif; font-size: 18px; text-anchor: middle; }
    .cy-pointlabel { fill: var(--ink); font-family: "Manrope","Segoe UI",system-ui,sans-serif; font-size: 24px; font-weight: 700; }
  </style>

