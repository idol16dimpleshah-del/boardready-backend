<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="rcyTitle rcyDesc">
  <title id="rcyTitle">Rectangle rolled into two cylinders, Question 1727</title>
  <desc id="rcyDesc">An 11 cm by 7 cm rectangle, an arrow to a vertical cylinder of height 7 cm formed by rotating about the 7 cm side, and a second arrow to a horizontal cylinder of length 11 cm formed by rotating about the 11 cm side.</desc>
  <!--
