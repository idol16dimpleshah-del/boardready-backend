    Content check (informational only -- this task does not promote the
    question): CSA = circumference x height in each case, so cylinder 2's
    CSA = 11 x 7 = 77 and cylinder 3's CSA = 7 x 11 = 77 -- equal regardless
    of which side is the rotation axis. This matches the stored/only
    internally-consistent answer, option (a) "1 : 1" (`correct: 0`),
    confirmed independently this session by direct calculation, not merely
    assumed from the stored value.

    DESIGN DECISION, disclosed: the source draws both cylinders as
    schematic, NOT-to-scale sketches (the vertical cylinder's drawn
    diameter is visibly larger, relative to its height, than the true
    7-height/11-circumference proportions would produce, i.e. true diameter
