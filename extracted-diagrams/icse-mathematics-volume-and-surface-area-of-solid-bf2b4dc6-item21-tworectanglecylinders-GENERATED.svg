         sheet of paper.
      2. A vertical, upright cylinder (open top and bottom drawn as full
         ellipses, connected by two vertical side lines) labelled "7 cm"
         along its left side -- this is the cylinder formed by rotating the
         rectangle about its 7 cm side (so 7 cm becomes the height/axis and
         11 cm becomes the circumference).
      3. A horizontal cylinder lying on its side (drawn as two end ellipses
         connected by two horizontal side lines, with the left end drawn as
         a double ellipse to suggest the rolled paper's visible edge/
         thickness, matching the source exactly) labelled "11 cm" along its
         length -- this is the cylinder formed by rotating the rectangle
         about its 11 cm side (so 11 cm becomes the height/axis and 7 cm
         becomes the circumference).
    The source presents the two cylinders in this same left-to-right order
    (7cm-axis cylinder, then 11cm-axis cylinder) even though the question's
    own text describes the 11 cm rotation first -- this redraw preserves the
    source figure's actual order exactly rather than reordering it to match
