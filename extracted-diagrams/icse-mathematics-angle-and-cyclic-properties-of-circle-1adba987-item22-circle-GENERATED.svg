<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" role="img" aria-labelledby="cyTitle cyDesc">
  <title id="cyTitle">Circle diagram for Question 1594</title>
  <desc id="cyDesc">A circle with diameter AB. Points D and C lie on the upper arc, with D to the left of centre and C to the right. Chords AD, DC and CB are drawn, so ADCB forms a cyclic quadrilateral. DC is parallel to AB, shown by matching arrowhead tick marks on both segments. A dashed diagonal joins A to C, and the angle between AB and this diagonal at vertex A is marked 35 degrees.</desc>
  <!--
    Board Ready generated visual (Workstream 3-Task4, proposed, NOT yet
    associated with the live question — see
    docs/workstream-3i-1594-1230-visual-reconstruction.md).
    asset_type (if approved): ai_generated — a clean, native redraw of the
    ORIGINAL SOURCE figure below, not the source figure itself. Colors are
    read from this host page's own CSS custom properties (the ink and violet
    tokens) via var(), with no prefers-color-scheme fallback, matching every
    other generated visual in this pipeline (see 3070's and 4575's SVGs):
    this file is only ever used inlined into the DOM, where it inherits the
    real #app[data-theme] cascade.

    SOURCE OF TRUTH this was redrawn from (never modified):
    source_library/ICSE/Mathematics/chap_17.pdf, printed page 17.4, item (22).
    Cross-referenced directly against the rendered source page (not the
    text layer). Semantic content reproduced exactly, not invented:
      - AB is a diameter (A left, B right), with centre O marked on it.
      - D and C lie on the arc above AB; D is left of centre, C is right
        of centre (confirmed against the source, not merely assumed).
      - Chords AD, DC, CB are drawn (ADCB is a cyclic quadrilateral).
      - DC is parallel to AB — the source marks this with a ">>"
        double-arrowhead tick on both AB (near O) and DC (near its
        midpoint); both are reproduced here in the same style and position
        relative to their segment.
      - A dashed diagonal joins A to C (not D to B — confirmed by close
        inspection of the source page; an earlier crop of a neighbouring,
        unrelated circle problem on the same page was initially mistaken
        for this one during this session and was re-verified before use).
      - The angle CAB, between ray AB and the dashed diagonal AC, is
        marked 35 degrees at vertex A. No other angle values are printed
        in the source figure.
      - No point other than A, B, C, D, O is labelled or drawn in the
        source.

    One deliberate, disclosed departure from the source's hand-drawn
    sketch, which does not affect the answer: the source diagram is not
    drawn to scale (by eye, its angle at A looks larger than 35 degrees,
    a common textbook-sketch imprecision — compare the already-corrected
    4575 graph, which is also explicitly "no scale"). This redraw instead
    places D and C using exact circle geometry so that the angle actually
    drawn at A is exactly 35 degrees: for a diameter AB and a point C on
    the circle at angle theta from the positive x-axis (measured from the
    centre), the angle CAB equals theta/2 exactly (a standard half-angle
    identity), so C is placed at theta = 70 degrees from centre, and D is
    placed as the mirror point of C across the vertical through the
    centre (the only way a chord can be parallel to a horizontal diameter
    is if it is symmetric about that vertical line — a mathematical
    necessity, not a simplification). This makes the redraw slightly more
    geometrically precise than the source sketch while preserving every
    labelled fact the source actually asserts (which side D and C are on,
    the parallel marking, the dashed diagonal, the 35-degree angle, the
    diameter). It does not add, remove, or change any given fact, and the
    correct answer (20 degrees, independently re-derived two ways in
    docs/workstream-3e-geometry-content-qa-1594-1230.md) is unaffected —
    it depends only on the given 35 degrees and the parallel/diameter
    facts, not on exact pixel placement.
  -->
