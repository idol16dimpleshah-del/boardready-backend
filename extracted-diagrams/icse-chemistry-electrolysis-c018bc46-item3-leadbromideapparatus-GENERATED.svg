  <style>
    .eb-wire { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .eb-zig { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .eb-celllong { stroke: var(--ink); stroke-width: 4; }
    .eb-cellshort { stroke: var(--ink); stroke-width: 4; }
    .eb-elec { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
