<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="ebTitle ebDesc">
  <title id="ebTitle">Electrolysis apparatus for molten lead bromide, Question 2061</title>
  <desc id="ebDesc">A circuit with a battery, switch, rheostat, and ammeter connects two graphite electrodes labelled X and Y, dipping into a crucible of molten lead bromide, which sits on a stand and is heated from below by a Bunsen burner flame.</desc>
