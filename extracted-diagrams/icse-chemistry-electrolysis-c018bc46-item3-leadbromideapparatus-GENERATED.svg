    Semantic content reproduced exactly, not invented (read directly off the
    source scan at high zoom this session):
      - A circuit loop: starting from a corner, a wire carries a "+" label,
        then an open-switch symbol (a small angled break in the wire), then
        continues to a 2-cell battery symbol (four parallel bars,
        alternating long/short), then a "-" label, then continues to a
        second corner.
      - From the "+" corner, the wire runs down through a rheostat
        (zigzag/coil resistor symbol) and then across to the left graphite
        electrode, labelled "Graphite [X]" via a leader line with an
        arrowhead pointing at the electrode.
      - From the "-" corner, the wire runs down through an ammeter (a
        circle containing "A") and then across to the right graphite
        electrode, labelled "Graphite [Y]" via a leader line with an
        arrowhead pointing at the electrode.
      - Both electrodes dip down into a crucible (drawn in the source as a
        rounded bowl/basin shape, shown here as the same bowl silhouette),
        which is labelled "Molten lead bromide" via a leader line pointing
        into the liquid between the two electrodes.
      - The crucible rests on a stand (the source draws a solid, wide
        triangular support), beneath which a Bunsen burner (a vertical
        barrel on a round base) burns with a visible flame, heating the
        crucible from below/outside -- directly illustrating option (b)'s
        text ("the crucible is heated from outside").
      - No numeric values, angles, or extra components appear in the source
        figure beyond what is listed above; none are added here either.

    DESIGN DECISIONS (disclosed, none of which change any labelled
    component, connection, or the circuit's topology):
